[package]
name = "wire-telemetry"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder local structured telemetry, ring buffers, redaction, fingerprints, and diagnostics (SPEC-019, SPEC-023, SPEC-025, SPEC-026, EP-028)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
