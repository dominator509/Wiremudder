[package]
name = "wire-ai-router"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder AI Provider Router: deterministic routing from declared inputs, privacy and budget routing, remote gating, explicit degradation, and evaluation fixtures for certification (SPEC-013, EP-016)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wire-provider-adapters = { path = "../wire-provider-adapters" }
wire-privacy = { path = "../wire-privacy" }
