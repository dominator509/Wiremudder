[package]
name = "wire-narrator"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder Personal Narrator: spoken/text summaries that disclose source, respect privacy, shed load, and never send commands (SPEC-015-R06, EP-020)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wire-quest = { path = "../wire-quest" }
wire-tactical = { path = "../wire-tactical" }
