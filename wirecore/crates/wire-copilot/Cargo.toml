[package]
name = "wire-copilot"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder Player Copilot: suggestion-only engine, cited Why explanations, calibrated non-authoritative confidence, visible disclosures, soul-document policy precedence, and no hidden command send (SPEC-014, EP-017)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wire-context = { path = "../wire-context" }
wire-ai-router = { path = "../wire-ai-router" }
wire-privacy = { path = "../wire-privacy" }
wire-token-budget = { path = "../wire-token-budget" }
wire-provider-adapters = { path = "../wire-provider-adapters" }
