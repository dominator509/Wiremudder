[package]
name = "wire-profiles"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder character memory profiles: versioned per-character defaults, sensitive-default audit, local-first export/import (SPEC-010, SPEC-017, SPEC-023)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
