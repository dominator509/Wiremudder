[package]
name = "wiremudder-perf-capture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder perf-capture CLI: drives owned crate perf fixtures reproducibly and writes raw SPEC-004-R12/SPEC-027-R06 benchmark artifacts (EP-032)"

[dependencies]
wiremudder-benchmarks = { path = "../../benchmarks/wiremudder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
