[package]
name = "help-indexer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WireMudder Help Knowledge Index generator (SPEC-018-R04, EP-027): reproducibly ingests accepted docs, schemas, command catalog, ADRs, and sanitized source references"

[[bin]]
name = "help-indexer"
path = "src/main.rs"

[dependencies]
wire-help = { path = "../../wirecore/crates/wire-help" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
